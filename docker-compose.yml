# Local development stack: `docker compose up -d db` for just Postgres (then `npm run dev`),
# or `docker compose up --build` for everything.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stackroost
      POSTGRES_PASSWORD: stackroost
      POSTGRES_DB: stackroost
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stackroost']
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stackroost:stackroost@db:5432/stackroost
    ports: ['4000:4000']
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stackroost:stackroost@db:5432/stackroost
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
